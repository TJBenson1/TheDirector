<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Director</title>
<style>
  :root { --bg:#0d0d0f; --panel:#151517; --line:#26262a; --text:#ece9e4; --dim:#8a8a92; --accent:#e0a13c; --user:#2a2118; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: ui-serif, Georgia, "Times New Roman", serif; -webkit-font-smoothing:antialiased; }
  #app { display:flex; flex-direction:column; height:100dvh; max-width:720px; margin:0 auto; }
  header { padding:16px 18px 10px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:22px; letter-spacing:.5px; }
  header .status { margin-top:4px; color:var(--dim); font-size:13px; font-family: ui-monospace, monospace; }
  #log { flex:1; overflow-y:auto; padding:16px 14px; display:flex; flex-direction:column; gap:12px; }
  .msg { padding:12px 14px; border-radius:12px; line-height:1.5; font-size:16px; white-space:pre-wrap; max-width:88%; }
  .narrator { background:var(--panel); border:1px solid var(--line); align-self:flex-start; }
  .director { background:var(--user); color:#f3d9ac; align-self:flex-end; }
  .sys { color:var(--dim); font-size:13px; align-self:center; text-align:center; font-family:ui-monospace,monospace; }
  .starts { display:flex; flex-wrap:wrap; gap:8px; align-self:flex-start; max-width:100%; }
  .starts button { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:10px;
    padding:8px 11px; font:inherit; font-size:13px; cursor:pointer; }
  .starts button:hover { border-color:var(--accent); }
  form { display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  input { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:12px;
    padding:13px 14px; font:inherit; font-size:16px; outline:none; }
  input:focus { border-color:var(--accent); }
  button.send { background:var(--accent); color:#1a1206; border:none; border-radius:12px; padding:0 18px; font:inherit; font-weight:700; cursor:pointer; }
  button.send:disabled { opacity:.5; }
  .dots::after { content:'…'; animation:blink 1.2s infinite; }
  @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
  .reset { background:none; border:none; color:var(--dim); font:inherit; font-size:12px; cursor:pointer; text-decoration:underline; }
  nav { display:flex; gap:4px; padding:6px 10px 0; border-bottom:1px solid var(--line); overflow-x:auto; }
  nav button { background:none; border:none; color:var(--dim); font:inherit; font-size:14px; padding:8px 12px; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
  nav button.active { color:var(--accent); border-bottom-color:var(--accent); }
  #panel { flex:1; overflow-y:auto; padding:14px; display:none; }
  #panel.show { display:block; }
  #log.hide { display:none; }
  .prow { display:flex; justify-content:space-between; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line); font-size:14px; }
  .prow .sub { color:var(--dim); font-size:12px; font-family:ui-monospace,monospace; }
  .prow.you { color:var(--accent); }
  .bar { height:5px; border-radius:3px; background:var(--line); overflow:hidden; margin-top:4px; width:80px; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .card h3 { margin:0 0 6px; font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; font-family:ui-monospace,monospace; }
  .card .big { font-size:20px; }
  .ibx { padding:9px 4px; border-bottom:1px solid var(--line); font-size:14px; }
  .ibx .tag { color:var(--dim); font-size:11px; font-family:ui-monospace,monospace; text-transform:uppercase; margin-right:6px; }
  .sub { color:var(--dim); font-size:12px; }
  .dim { color:var(--dim); }
  .ok { color:#6fbf73; font-family:ui-monospace,monospace; font-size:12px; }
  .warn { color:var(--accent); font-family:ui-monospace,monospace; font-size:12px; }
  .tag.red { color:#d9704e; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-block; background:#1c1c20; border:1px solid var(--line); border-radius:8px; padding:4px 8px; font-size:12.5px; }
  .chip.star { border-color:var(--accent); }
  #hint { text-align:center; color:var(--dim); font-size:11.5px; padding:6px 12px 10px; }
  .adv { background:var(--panel); border:1px solid var(--accent); color:var(--accent); border-radius:9px;
    padding:6px 12px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; margin-left:10px; }
  .adv:hover { background:var(--accent); color:#1a1206; }
  .adv:disabled { opacity:.5; cursor:default; }
  .act { display:flex; gap:6px; margin-top:6px; justify-content:flex-end; flex-wrap:wrap; }
  .act button { background:#1c1c20; border:1px solid var(--line); color:var(--text); border-radius:8px;
    padding:5px 10px; font:inherit; font-size:12px; cursor:pointer; }
  .act button:hover { border-color:var(--accent); }
  .act button.sell:hover { border-color:#d9704e; color:#d9704e; }
  .decision { background:var(--panel); border:1px solid var(--accent); border-radius:12px; padding:12px 14px; align-self:stretch; max-width:100%; }
  .decision .t { font-size:15px; margin-bottom:8px; }
  .decision .choices { display:flex; flex-wrap:wrap; gap:8px; }
  .decision .choices button { background:#1c1c20; border:1px solid var(--line); color:var(--text); border-radius:9px;
    padding:8px 12px; font:inherit; font-size:13px; cursor:pointer; }
  .decision .choices button:hover { border-color:var(--accent); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h1>The Director</h1>
      <div style="display:flex; align-items:center;">
        <button class="adv" id="advance" type="button" title="Move time forward without spending a chat message">Advance ▸</button>
        <button class="reset" id="newgame" type="button" style="margin-left:10px;">New game</button>
      </div>
    </div>
    <div class="status" id="status">A counterfactual football story · 1995–2025</div>
  </header>
  <nav id="tabs">
    <button data-tab="chat" class="active">Chat</button>
    <button data-tab="manager">Manager's Room</button>
    <button data-tab="squad">Squad</button>
    <button data-tab="finances">Finances</button>
    <button data-tab="table">Table</button>
    <button data-tab="inbox">Inbox</button>
  </nav>
  <div id="log"></div>
  <div id="panel"></div>
  <form id="form">
    <input id="input" placeholder="Speak to the room…" autocomplete="off" />
    <button class="send" id="send" type="submit">Send</button>
  </form>
  <div id="hint">Tip: one or two requests per message keeps the boardroom sharp and the replies quick.</div>
</div>
<script>
const KEY = 'the-director-web-v1';
let state = null, history = [];
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');

function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify({ state, history })); } catch(e){} }
function loadLocal(){ try { const d = JSON.parse(localStorage.getItem(KEY)||'null'); if(d){ state=d.state; history=d.history||[]; } } catch(e){} }

function bubble(text, cls){ const el=document.createElement('div'); el.className='msg '+cls; el.textContent=text; log.appendChild(el); log.scrollTop=log.scrollHeight; return el; }

function renderStatus(){
  const st = state && stFrom(state);
  statusEl.textContent = st ? `${st.club} · ${st.date} · ${st.window||'in season'} · ${st.budget}` : 'A counterfactual football story · 1995–2025';
}
function stFrom(s){ try { const c=s.clubs[s.playerClub]; return { club:c.name, date:s.clock.date, window:s.clock.window, budget:'£'+((c.finances.transferBudget/1e6).toFixed(1))+'m' }; } catch(e){ return null; } }

async function send(message){
  bubble(message, 'director');
  input.value=''; sendBtn.disabled=true;
  const thinking = bubble('', 'msg narrator'); thinking.className='msg narrator dots';
  try {
    const r = await fetch('/games/narrate', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ state, message, history }) });
    const d = await r.json();
    thinking.remove();
    if (d.error){ bubble('('+d.error+')', 'sys'); }
    else {
      state = d.state; history = d.history || history;
      bubble(d.narration, 'narrator');
      // A pre-scripted follow-up beat (e.g. the manager meeting after a new game).
      if (d.secondary){ const m=d.secondary; setTimeout(()=>bubble(m, 'narrator'), 650); }
      saveLocal(); renderStatus(); refreshPanelIfOpen(); renderPendingDecisions();
    }
  } catch(e){ thinking.remove(); bubble('(the line went dead — try again)', 'sys'); }
  sendBtn.disabled=false; input.focus();
}

// Keep the narrator's chat history in sync with token-free direct actions (advance,
// sell, renew, decisions) so the next chat turn still has continuity — capped like
// the server does.
function noteTurn(u, a){ history.push({ role:'user', content:u }, { role:'assistant', content:a }); history = history.slice(-24); }

// ── Advance: move time forward with NO model call (saves tokens) ──────────────
async function advance(){
  if(!state){ bubble('Take a seat first — start a game in the Chat tab.', 'sys'); return; }
  const advBtn = document.getElementById('advance');
  advBtn.disabled=true; sendBtn.disabled=true;
  try {
    const r = await fetch('/games/advance', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ state, perStep:true }) });
    const d = await r.json();
    if (d.error){ bubble('('+d.error+')', 'sys'); }
    else {
      state = d.state;
      const msgs = (d.events||[]).map(e=>e.message).filter(Boolean);
      const st = stFrom(state);
      const head = st ? `${st.date} · ${st.window||'in season'}` : 'Advanced';
      const body = msgs.length ? msgs.slice(0,10).join('\n') : 'The month passes quietly.';
      bubble(head + '\n' + body, 'narrator');
      noteTurn('Advance.', head+' — '+(msgs.slice(0,6).join('; ')||'quiet'));
      renderPendingDecisions();
      saveLocal(); renderStatus(); refreshPanelIfOpen();
    }
  } catch(e){ bubble('(could not advance — try again)', 'sys'); }
  advBtn.disabled=false; sendBtn.disabled=false;
}

// Surface any open interrupts as clickable, token-free decision cards.
function renderPendingDecisions(){
  const ds = (state && state.pendingDecisions) || [];
  for (const d of ds){
    if (document.querySelector('[data-decision="'+CSS.escape(d.id)+'"]')) continue; // already shown
    const wrap=document.createElement('div'); wrap.className='msg decision'; wrap.dataset.decision=d.id;
    const t=document.createElement('div'); t.className='t'; t.textContent=d.title; wrap.appendChild(t);
    const ch=document.createElement('div'); ch.className='choices';
    (d.choices||[]).forEach(c=>{ const b=document.createElement('button'); b.textContent=c.label; b.onclick=()=>resolveDecision(d.id, c.id, d.title, c.label); ch.appendChild(b); });
    wrap.appendChild(ch); log.appendChild(wrap); log.scrollTop=log.scrollHeight;
  }
}

async function resolveDecision(decisionId, choiceId, title, label){
  const card = document.querySelector('[data-decision="'+CSS.escape(decisionId)+'"]');
  if(card) card.querySelectorAll('button').forEach(b=>b.disabled=true);
  try {
    const r = await fetch('/games/decision', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ state, decisionId, choiceId }) });
    const d = await r.json();
    if (d.error){ bubble('('+d.error+')', 'sys'); return; }
    state = d.state;
    if(card) card.remove();
    const msgs = (d.events||[]).map(e=>e.message).filter(Boolean);
    bubble('▸ '+label+(msgs.length?'\n'+msgs.slice(0,6).join('\n'):''), 'director');
    noteTurn(title+' → '+label, msgs.slice(0,6).join('; ')||'Done.');
    renderPendingDecisions();
    saveLocal(); renderStatus(); refreshPanelIfOpen();
  } catch(e){ bubble('(could not resolve — try again)', 'sys'); }
}

function offerStarts(){
  fetch('/scenarios').then(r=>r.json()).then(list=>{
    const wrap=document.createElement('div'); wrap.className='starts';
    // ALL scenarios (sorted by year), so nothing is hidden.
    list.slice().sort((a,b)=>String(a.startDate).localeCompare(String(b.startDate))).forEach(sc=>{
      const b=document.createElement('button'); b.textContent=sc.name; b.onclick=()=>startGame(sc.id, sc.name); wrap.appendChild(b);
    });
    log.appendChild(wrap);
  });
}
// Start a game via the PRE-SCRIPTED opening — no model call, so it's instant.
async function startGame(scenarioId, name){
  bubble('Take the '+name+' job.', 'director');
  sendBtn.disabled=true;
  const thinking = bubble('', 'msg narrator'); thinking.className='msg narrator dots';
  try {
    const r = await fetch('/games/start', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ scenarioId }) });
    const d = await r.json();
    thinking.remove();
    if (d.error){ bubble('('+d.error+')', 'sys'); }
    else {
      state = d.state;
      const full = d.secondary ? d.narration+'\n\n'+d.secondary : d.narration;
      // Seed the chat history with the whole opening so the narrator has context next turn.
      history = [{ role:'user', content:'Take the '+name+' job.' }, { role:'assistant', content:full }];
      bubble(d.narration, 'narrator');
      // The manager sits down for the first meeting — a beat later, as a second reply.
      if (d.secondary){ const m=d.secondary; setTimeout(()=>bubble(m, 'narrator'), 650); }
      saveLocal(); renderStatus(); refreshPanelIfOpen();
    }
  } catch(e){ thinking.remove(); bubble('(could not start — try again)', 'sys'); }
  sendBtn.disabled=false;
}
function newGame(){
  if(state && !confirm('Leave this playthrough and start a new one? Your current game will be cleared.')) return;
  state=null; history=[]; panelsCache=null;
  try{ localStorage.removeItem(KEY); }catch(e){}
  log.innerHTML=''; renderStatus();
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active', x.dataset.tab==='chat'));
  showTab('chat');
  bubble("You're the Director — the power above the manager. Pick a seat to take, or just tell me which club and season you want.", 'narrator');
  offerStarts();
}

document.getElementById('form').addEventListener('submit', e=>{ e.preventDefault(); const v=input.value.trim(); if(v) send(v); });
document.getElementById('newgame').addEventListener('click', ()=>newGame());
document.getElementById('advance').addEventListener('click', ()=>advance());

// ── Squad actions: extend a contract, or look for a sale — all token-free ─────
async function extendFlow(id, name){
  const yrs = prompt(`Extend ${name}'s contract by how many years? (1–5)`, '3');
  if(yrs===null) return;
  const years = Math.max(1, Math.min(5, Math.round(Number(yrs)||3)));
  try {
    const r = await fetch('/games/renew', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ state, playerId:id, years }) });
    const d = await r.json();
    if(d.result && d.result.ok){ state=d.state; noteTurn(`Extend ${name}'s contract`, `${name} signs on until ${d.result.contractUntil}.`); bubble(`✓ ${name} extended to ${d.result.contractUntil}.`, 'sys'); saveLocal(); renderStatus(); showTab('squad'); }
    else bubble('('+((d.result&&d.result.reason)||d.error||'could not extend')+')', 'sys');
  } catch(e){ bubble('(could not extend — try again)', 'sys'); }
}

async function sellFlow(id, name){
  try {
    const r = await fetch('/games/offers', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ state, playerId:id }) });
    const d = await r.json();
    const offers = d.offers||[];
    if(!offers.length){ bubble(`No club is in the market for ${name} right now (value ~£${((d.marketValue||0)/1e6).toFixed(1)}m).`, 'sys'); return; }
    // Replace the row's action area with the concrete offers.
    const row = document.querySelector('[data-player="'+CSS.escape(id)+'"] .act');
    const gbp = f=>'£'+(f/1e6).toFixed(1)+'m';
    if(row){
      row.innerHTML = `<span class="sub" style="align-self:center">Sell to:</span>` +
        offers.map(o=>`<button class="sell" data-club="${esc(o.clubId)}" data-fee="${o.fee}">${esc(o.clubName)} ${gbp(o.fee)}</button>`).join('') +
        `<button data-cancel="1">Cancel</button>`;
      row.querySelectorAll('button').forEach(b=>{
        if(b.dataset.cancel){ b.onclick=()=>showTab('squad'); return; }
        b.onclick=()=>doSell(id, name, b.dataset.club, b.textContent, Number(b.dataset.fee));
      });
    }
  } catch(e){ bubble('(could not fetch offers — try again)', 'sys'); }
}

async function doSell(id, name, toClub, clubLabel, fee){
  try {
    const r = await fetch('/games/sell', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ state, playerId:id, toClub, fee }) });
    const d = await r.json();
    if(d.result && d.result.ok){
      state=d.state;
      const ripple = d.result.sated ? ` (${clubLabel.trim()} now drop their move for ${d.result.sated})` : '';
      bubble(`✓ Sold ${name} to ${clubLabel.trim()}.${ripple}`, 'sys');
      noteTurn(`Sell ${name}`, `${name} sold to ${clubLabel.trim()}.${ripple}`);
      saveLocal(); renderStatus(); showTab('squad');
    } else bubble('('+((d.result&&d.result.reason)||d.error||'sale fell through')+')', 'sys');
  } catch(e){ bubble('(could not sell — try again)', 'sys'); }
}

// ── Clickable panels ─────────────────────────────────────────────────────────
const panel = document.getElementById('panel');
let panelsCache = null;
document.getElementById('tabs').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active', x===b));
  showTab(b.dataset.tab);
});
async function showTab(tab){
  const isChat = tab==='chat';
  log.classList.toggle('hide', !isChat);
  panel.classList.toggle('show', !isChat);
  if(isChat) return;
  if(!state){ panel.innerHTML = '<div class="sys">Start a game first — take a seat in the Chat tab.</div>'; return; }
  panel.innerHTML = '<div class="sys">Loading…</div>';
  try {
    const r = await fetch('/games/panels', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ state }) });
    panelsCache = (await r.json()).panels;
    renderPanel(tab);
  } catch(e){ panel.innerHTML = '<div class="sys">(could not load)</div>'; }
}
function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function renderPanel(tab){
  const p = panelsCache; if(!p) return;
  if(tab==='squad'){
    const legend = `<div class="sub" style="padding:2px 4px 8px">value · wage · happiness (bar) · mins% · impact — ⚠ = behind the market, will want a new deal. Tap Extend or Sell to act without spending a chat message</div>`;
    panel.innerHTML = legend + p.squad.map(pl=>`<div class="prow" data-player="${esc(pl.id)}"><div style="flex:1"><div>${esc(pl.name)}${pl.injured?' 🩹':''}</div><div class="sub">${esc(pl.position)} · ${pl.age}y · abi ${pl.ability} · to ${pl.contractUntil}</div><div class="bar"><i style="width:${pl.happiness}%"></i></div></div><div style="text-align:right"><div>${esc(pl.value)}</div><div class="sub">${esc(pl.wage||'')}${pl.underMarket?` <span class="warn" title="Market rate ${esc(pl.marketWage)}">⚠ under market</span>`:''}</div><div class="sub">${esc(pl.minutes)} · ${esc(pl.impact)}</div><div class="act"><button data-ext="${esc(pl.id)}" data-name="${esc(pl.name)}">Extend</button><button class="sell" data-sell="${esc(pl.id)}" data-name="${esc(pl.name)}">Sell</button></div></div></div>`).join('');
    panel.querySelectorAll('[data-ext]').forEach(b=>b.onclick=()=>extendFlow(b.dataset.ext, b.dataset.name));
    panel.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>sellFlow(b.dataset.sell, b.dataset.name));
  } else if(tab==='finances'){
    const f=p.finances;
    panel.innerHTML =
      `<div class="card"><h3>Transfer budget</h3><div class="big">${esc(f.transferBudget)}</div></div>`+
      `<div class="card"><h3>Wages</h3><div>Bill ${esc(f.wageBillAnnual)} / budget ${esc(f.wageBudgetAnnual)} · headroom ${esc(f.wageHeadroom)}</div></div>`+
      `<div class="card"><h3>Commercial heft</h3><div>${esc(f.commercialHeft)}</div></div>`+
      `<div class="card"><h3>Liabilities &amp; ownership</h3><div>${esc(f.liabilities)} · ${esc(f.ownership)} · health: ${esc(f.financialHealth)}</div></div>`;
  } else if(tab==='table'){
    panel.innerHTML = p.table.map(r=>`<div class="prow ${r.isYou?'you':''}"><div>${r.pos}. ${esc(r.club)}</div><div class="sub">P${r.played} · ${r.points} pts</div></div>`).join('');
  } else if(tab==='inbox'){
    panel.innerHTML = p.inbox.length ? p.inbox.map(i=>`<div class="ibx"><span class="tag">${esc(i.kind)}</span>${esc(i.text)}</div>`).join('') : '<div class="sys">Nothing pressing.</div>';
  } else if(tab==='manager'){
    const r = p.manager; if(!r){ panel.innerHTML='<div class="sys">No coach yet.</div>'; return; }
    const xi = r.xi.map(x=>`<span class="chip${x.topPerformer?' star':''}">${esc(x.slot)} ${esc(x.name)}${x.natural?'':' *'}${x.topPerformer?' ★':''}</span>`).join(' ');
    const depth = r.depth.map(d=>`<div class="prow"><div><div>${esc(d.label)}</div><div class="sub">${d.players.map(pl=>`${esc(pl.name)}${pl.starter?' ▶':''}${pl.injured?' 🩹':''} <span class="dim">(${pl.ability}, ${pl.age})</span>`).join(' · ')}</div></div></div>`).join('');
    const rising = r.risingStars.length ? r.risingStars.map(s=>`<div class="prow"><div><div>${esc(s.name)} <span class="sub">${s.age}y · abi ${s.ability}→${s.potential}</span></div><div class="sub">${esc(s.note)}</div></div><div style="text-align:right"><div class="${s.developing?'ok':'warn'}">${s.minutesPct}% mins</div></div></div>`).join('') : '<div class="sub">No standout youngsters coming through.</div>';
    const concerns = r.concerns.length ? r.concerns.map(c=>`<div class="ibx"><span class="tag ${c.severity==='urgent'?'red':''}">${c.severity}</span><b>${esc(c.name)}</b> — ${esc(c.issue)}</div>`).join('') : '<div class="sub">Nothing pressing.</div>';
    const wants = r.wants.length ? r.wants.map(w=>`<span class="chip">${esc(w.name)} <span class="dim">(${esc(w.position)}, ${esc(w.club)})</span></span>`).join(' ') : '<span class="sub">Happy with the options.</span>';
    const offload = r.offload.length ? r.offload.map(o=>`<div class="sub">↗ ${esc(o.name)} — ${esc(o.reason)}</div>`).join('') : '<div class="sub">No one being moved on.</div>';
    panel.innerHTML =
      `<div class="card"><h3>${esc(r.coach)}</h3><div>${esc(r.style)}</div><div class="sub" style="margin-top:4px">Shape ${esc(r.formation)} · priority: ${esc(r.priority)}</div><div class="sub" style="margin-top:6px">Happiness</div><div class="bar"><i style="width:${r.happinessPct}%"></i></div><div class="sub" style="margin-top:4px">${esc(r.happiness)}</div><div class="sub" style="margin-top:8px">Tell me in Chat to change the manager or his style.</div></div>`+
      `<div class="card"><h3>First-choice XI <span class="sub">★ top form · * out of position</span></h3><div class="chips">${xi}</div></div>`+
      `<div class="card"><h3>Depth chart</h3>${depth}</div>`+
      `<div class="card"><h3>Rising stars <span class="sub">and their game time</span></h3>${rising}</div>`+
      `<div class="card"><h3>Concerns</h3>${concerns}</div>`+
      `<div class="card"><h3>Coach's wishlist</h3><div class="sub" style="margin-bottom:6px">Wants in:</div><div class="chips">${wants}</div><div class="sub" style="margin:8px 0 4px">Would move on:</div>${offload}</div>`;
  }
}
// Refresh the open panel after each chat turn (state changed).
const _origSave = saveLocal;
function refreshPanelIfOpen(){ const active=document.querySelector('#tabs button.active'); if(active && active.dataset.tab!=='chat' && panel.classList.contains('show')) showTab(active.dataset.tab); }

loadLocal();
if (history.length){
  history.forEach(h=>{ const t = typeof h.content==='string'? h.content : ''; if(t) bubble(t, h.role==='user'?'director':'narrator'); });
  renderStatus(); renderPendingDecisions();
} else {
  bubble("You're the Director — the power above the manager. Pick a seat to take, or just tell me which club and season you want.", 'narrator');
  offerStarts();
}
</script>
