<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Director</title>
<style>
  :root { --bg:#0d0d0f; --panel:#151517; --line:#26262a; --text:#ece9e4; --dim:#8a8a92; --accent:#e0a13c; --user:#2a2118; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: ui-serif, Georgia, "Times New Roman", serif; -webkit-font-smoothing:antialiased; }
  #app { display:flex; flex-direction:column; height:100dvh; max-width:720px; margin:0 auto; }
  header { padding:16px 18px 10px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:22px; letter-spacing:.5px; }
  header .status { margin-top:4px; color:var(--dim); font-size:13px; font-family: ui-monospace, monospace; }
  #log { flex:1; overflow-y:auto; padding:16px 14px; display:flex; flex-direction:column; gap:12px; }
  .msg { padding:12px 14px; border-radius:12px; line-height:1.5; font-size:16px; white-space:pre-wrap; max-width:88%; }
  .narrator { background:var(--panel); border:1px solid var(--line); align-self:flex-start; }
  .director { background:var(--user); color:#f3d9ac; align-self:flex-end; }
  .sys { color:var(--dim); font-size:13px; align-self:center; text-align:center; font-family:ui-monospace,monospace; }
  .starts { display:flex; flex-wrap:wrap; gap:8px; align-self:flex-start; max-width:100%; }
  .starts button { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:10px;
    padding:8px 11px; font:inherit; font-size:13px; cursor:pointer; }
  .starts button:hover { border-color:var(--accent); }
  form { display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  input { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:12px;
    padding:13px 14px; font:inherit; font-size:16px; outline:none; }
  input:focus { border-color:var(--accent); }
  button.send { background:var(--accent); color:#1a1206; border:none; border-radius:12px; padding:0 18px; font:inherit; font-weight:700; cursor:pointer; }
  button.send:disabled { opacity:.5; }
  .dots::after { content:'…'; animation:blink 1.2s infinite; }
  @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
  .reset { background:none; border:none; color:var(--dim); font:inherit; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>The Director</h1>
    <div class="status" id="status">A counterfactual football story · 1995–2025</div>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="Speak to the room…" autocomplete="off" />
    <button class="send" id="send" type="submit">Send</button>
  </form>
</div>
<script>
const KEY = 'the-director-web-v1';
let state = null, history = [];
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');

function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify({ state, history })); } catch(e){} }
function loadLocal(){ try { const d = JSON.parse(localStorage.getItem(KEY)||'null'); if(d){ state=d.state; history=d.history||[]; } } catch(e){} }

function bubble(text, cls){ const el=document.createElement('div'); el.className='msg '+cls; el.textContent=text; log.appendChild(el); log.scrollTop=log.scrollHeight; return el; }

function renderStatus(){
  const st = state && stFrom(state);
  statusEl.textContent = st ? `${st.club} · ${st.date} · ${st.window||'in season'} · ${st.budget}` : 'A counterfactual football story · 1995–2025';
}
function stFrom(s){ try { const c=s.clubs[s.playerClub]; return { club:c.name, date:s.clock.date, window:s.clock.window, budget:'£'+((c.finances.transferBudget/1e6).toFixed(1))+'m' }; } catch(e){ return null; } }

async function send(message){
  bubble(message, 'director');
  input.value=''; sendBtn.disabled=true;
  const thinking = bubble('', 'msg narrator'); thinking.className='msg narrator dots';
  try {
    const r = await fetch('/games/narrate', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ state, message, history }) });
    const d = await r.json();
    thinking.remove();
    if (d.error){ bubble('('+d.error+')', 'sys'); }
    else {
      state = d.state; history = d.history || history;
      bubble(d.narration, 'narrator');
      saveLocal(); renderStatus();
    }
  } catch(e){ thinking.remove(); bubble('(the line went dead — try again)', 'sys'); }
  sendBtn.disabled=false; input.focus();
}

function offerStarts(){
  fetch('/scenarios').then(r=>r.json()).then(list=>{
    const wrap=document.createElement('div'); wrap.className='starts';
    const pick = list.slice().sort(()=>Math.random()-0.5).slice(0,5);
    pick.forEach(sc=>{ const b=document.createElement('button'); b.textContent=sc.name; b.onclick=()=>send('Take the '+sc.name+' job.'); wrap.appendChild(b); });
    log.appendChild(wrap);
  });
}

document.getElementById('form').addEventListener('submit', e=>{ e.preventDefault(); const v=input.value.trim(); if(v) send(v); });

loadLocal();
if (history.length){
  history.forEach(h=>{ const t = typeof h.content==='string'? h.content : ''; if(t) bubble(t, h.role==='user'?'director':'narrator'); });
  renderStatus();
} else {
  bubble("You're the Director — the power above the manager. Pick a seat to take, or just tell me which club and season you want.", 'narrator');
  offerStarts();
}
</script>
</body>
</html>
