name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & property tests
        run: pnpm test

      # The realism gate (§12, §18). A PR that makes the world too kind fails
      # here. Career count is reduced in CI for speed; the band assertions are
      # identical. Bump --careers back to 500+ for a full calibration pass.
      - name: Monte Carlo calibration harness
        run: pnpm harness -- --careers=150 --years=15

      # The Historian realism-review layer (docs/DESIGN-historian.md). Judges
      # plausibility where code asserts statistics. It gates only on a CONFIRMED
      # SEVERE (or too-many-MODERATE) finding. Without an API key the run is
      # SKIPPED and never fails the build — a missing key is a config gap, not a
      # realism regression. Provide ANTHROPIC_API_KEY as a repo secret to enable.
      - name: Historian — data-pack validation (Mode 3)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm historian -- --mode=datapack --scenario=man-utd-1999 --out=realism-datapack.md

      - name: Historian — calibration review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm historian -- --mode=calibration --careers=8 --years=15 --out=realism-report.md

      - name: Upload realism reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realism-reports
          path: |
            realism-report.md
            realism-datapack.md
          if-no-files-found: ignore
